server:
  port: ${PORT:8080}

spring:
  application:
    name: deepguard-be

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 600000
      keepalive-time: 300000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  logging:
    level:
      org.springframework.security: INFO
      com.deepguard.security: INFO

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  default-admin:
    email: ${DEFAULT_ADMIN_EMAIL:}
    username: ${DEFAULT_ADMIN_USERNAME:}
    password: ${DEFAULT_ADMIN_PASSWORD:}
  supabase:
    url: ${SUPABASE_URL}
    service-key: ${SUPABASE_SERVICE_KEY}
    bucket-name: ${SUPABASE_BUCKET_NAME:deepguard-storage}
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
      ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/billing/payments/vnpay/ipn}
      version: ${VNPAY_VERSION:2.1.0}
      command: ${VNPAY_COMMAND:pay}
      order-type: ${VNPAY_ORDER_TYPE:other}
      curr-code: ${VNPAY_CURR_CODE:VND}
      locale: ${VNPAY_LOCALE:vn}
    sepay:
      webhook-secret: ${SEPAY_WEBHOOK_SECRET}
      bank-code: ${SEPAY_BANK_CODE}
      bank-account-no: ${SEPAY_BANK_ACCOUNT_NO}
      bank-account-name: ${SEPAY_BANK_ACCOUNT_NAME}
      qr-template: ${SEPAY_QR_TEMPLATE:compact2}
      qr-base-url: ${SEPAY_QR_BASE_URL:https://img.vietqr.io/image}
      transfer-content-prefix: ${SEPAY_TRANSFER_CONTENT_PREFIX:SEPAY}

  ai:
    python-server-url: ${AI_PYTHON_SERVER_URL:https://squeezing-headdress-passably.ngrok-free.dev}

  hive:
    api-key: ${HIVE_API_KEY}
    model-name: ${HIVE_MODEL_NAME:ai-generated-and-deepfake-content-detection}
    base-url: ${HIVE_BASE_URL:https://api.thehive.ai/api/v3}
    timeout-ms: ${HIVE_TIMEOUT_MS:30000}
    threshold: ${HIVE_THRESHOLD:0.9}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@deep-guard.xyz}
